<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Frame Kartun Tangan</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff}
#cvOut{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b1620;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0;font-size:22px;letter-spacing:.5px}
#ov p{margin:0;max-width:320px;font-size:14px;line-height:1.5;color:#9fb3c4}
button{font:inherit;color:#fff;border:0;border-radius:999px;padding:12px 26px;background:#2f7bff;font-weight:600;cursor:pointer}
button:disabled{opacity:.5}
#errMsg{color:#ff8a8a;font-size:13px;max-width:320px;min-height:16px}
#hint{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:8px 16px;border-radius:999px;font-size:13px;transition:opacity .3s;pointer-events:none;z-index:2;white-space:nowrap}
#bar{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px;z-index:3}
#bar button{padding:8px 16px;font-size:13px;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);font-weight:500}
#fps{position:fixed;top:10px;left:12px;font:11px ui-monospace,monospace;opacity:.7;z-index:3;text-shadow:0 0 3px #000}
</style>
</head>
<body>
<canvas id="cvOut"></canvas>
<div id="fps"></div>
<div id="hint">Bentuk huruf L (jempol + telunjuk) dengan kedua tangan</div>
<div id="bar" style="display:none">
  <button id="flip">Ganti kamera</button>
  <button id="btnGender">Gaya: Perempuan</button>
  <button id="btnHair">Rambut &amp; baju: nyala</button>
  <button id="btnDots">Titik tangan: mati</button>
</div>
<div id="ov">
  <h1>Frame Kartun Tangan</h1>
  <p>Bentuk huruf L dengan jempol dan telunjuk di kedua tangan. Area di antara kedua tangan berubah jadi tampilan kartun, termasuk wajah, dahi, rambut, dan pakaian (otomatis).</p>
  <button id="go">Mulai Kamera</button>
  <div id="errMsg"></div>
</div>

<script type="module">
let HandLandmarker,FilesetResolver,FaceLandmarker,ImageSegmenter;

const $=id=>document.getElementById(id);
const out=$("cvOut"),ctx=out.getContext('2d',{alpha:false});
const video=document.createElement('video');
video.setAttribute('playsinline','');video.setAttribute('autoplay','');video.muted=true;
video.style.cssText='position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0';
document.body.appendChild(video);
const glCv=document.createElement('canvas');
const cart=document.createElement('canvas'),cctx=cart.getContext('2d');
const bcv=document.createElement('canvas'),bctx=bcv.getContext('2d');
const MOB=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||(typeof matchMedia==='function'&&matchMedia('(pointer:coarse)').matches);
const SS=MOB?1.5:2,R=MOB?1:2;
let lite=false,fEma=16;
let W=640,H=480,mirror=true,facing='user',hl=null,gl=null,tex=null,uPx=null;
let showDbg=false;

/* ---------- kamera ---------- */
async function openCam(){
  if(video.srcObject)video.srcObject.getTracks().forEach(t=>t.stop());
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Browser/halaman ini tidak mengizinkan kamera (butuh HTTPS, dan bukan WebView/iframe tanpa izin kamera). Buka di Chrome/Safari.');
  let s;
  try{s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:MOB?480:640},height:{ideal:MOB?360:480}}})}
  catch(e){
    if(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))throw e;
    s=await navigator.mediaDevices.getUserMedia({audio:false,video:true});
  }
  video.srcObject=s;
  try{await video.play()}catch(e){}
  if(!video.videoWidth)await new Promise(r=>{video.onloadedmetadata=r;setTimeout(r,4000)});
  if(!video.videoWidth)throw new Error('Kamera terbuka tapi tidak mengirim gambar.');
  W=video.videoWidth;H=video.videoHeight;
  glCv.width=bcv.width=W;glCv.height=bcv.height=H;
  out.width=cart.width=W*SS;out.height=cart.height=H*SS;
  ctx.imageSmoothingQuality=MOB?'medium':'high';cctx.imageSmoothingQuality=MOB?'medium':'high';
  firstBlend=true;lastGlT=-1;
  mirror=facing==='user';
  tgt=null;curInit=false;alpha=0;lastT=-1;
  segFirst=true;lastST=-1;
}

/* ---------- model tangan ---------- */
async function loadModel(){
  const bases=["https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14","https://unpkg.com/@mediapipe/tasks-vision@0.10.14"];
  let base=null,lastErr;
  for(const b of bases){
    try{
      const m=await import(b+(b.includes('jsdelivr')?'/+esm':'/vision_bundle.mjs'));
      HandLandmarker=m.HandLandmarker;FaceLandmarker=m.FaceLandmarker;ImageSegmenter=m.ImageSegmenter;FilesetResolver=m.FilesetResolver;base=b;break;
    }catch(e){lastErr=e}
  }
  if(!base)throw lastErr||new Error('Gagal memuat MediaPipe');
  const fs=await FilesetResolver.forVisionTasks(base+"/wasm");
  const o=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",delegate:d},runningMode:"VIDEO",numHands:2,minHandDetectionConfidence:.5,minHandPresenceConfidence:.5,minTrackingConfidence:.5});
  try{hl=await HandLandmarker.createFromOptions(fs,o("GPU"))}
  catch(e){hl=await HandLandmarker.createFromOptions(fs,o("CPU"))}
  const fo=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",delegate:d},runningMode:"VIDEO",numFaces:1,outputFaceBlendshapes:true});
  try{
    try{fl=await FaceLandmarker.createFromOptions(fs,fo("GPU"))}
    catch(e){fl=await FaceLandmarker.createFromOptions(fs,fo("CPU"))}
  }catch(e){fl=null}
  // segmentasi otomatis: rambut + kulit wajah (termasuk dahi)
  try{
    const so=d=>({baseOptions:{modelAssetPath:"https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite",delegate:d},runningMode:"VIDEO",outputCategoryMask:true,outputConfidenceMasks:false});
    try{seg=await ImageSegmenter.createFromOptions(fs,so("GPU"))}
    catch(e){seg=await ImageSegmenter.createFromOptions(fs,so("CPU"))}
  }catch(e){seg=null}
}

/* ---------- shader kartun ---------- */
function initGL(){
  if(gl)return;
  gl=glCv.getContext('webgl',{antialias:false,alpha:false});
  if(!gl)return;
  const vs=`attribute vec2 p;varying vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;
  const fsrc=`precision highp float;uniform sampler2D tex;uniform vec2 px;varying vec2 uv;
  vec3 S(vec2 o){return texture2D(tex,uv+o*px).rgb;}
  float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
  void main(){
    vec3 c=S(vec2(0.));
    vec3 acc=vec3(0.);float ws=0.;
    for(int i=-${R};i<=${R};i++){for(int j=-${R};j<=${R};j++){
      vec2 o=vec2(float(i),float(j))*${MOB?'4.2':'3.0'};
      vec3 t=S(o);vec3 d=t-c;
      float w=exp(-dot(o,o)/${MOB?'55.':'28.'})*exp(-dot(d,d)/.05);
      acc+=t*w;ws+=w;}}
    vec3 sm=acc/ws;
    float tl=L(S(vec2(-1.5,-1.5))),tt=L(S(vec2(0.,-1.5))),tr=L(S(vec2(1.5,-1.5)));
    float ll=L(S(vec2(-1.5,0.))),rr=L(S(vec2(1.5,0.)));
    float bl=L(S(vec2(-1.5,1.5))),bb=L(S(vec2(0.,1.5))),br=L(S(vec2(1.5,1.5)));
    float gx=-tl-2.*ll-bl+tr+2.*rr+br,gy=-tl-2.*tt-tr+bl+2.*bb+br;
    float e=smoothstep(.4,.95,length(vec2(gx,gy)));
    float lum=L(sm);
    float q=floor(lum*6.+.5)/6.;
    sm*=mix(1.,(q+.03)/(lum+.03),.5);
    float g=L(sm);sm=mix(vec3(g),sm,1.3);
    float red=smoothstep(.2,.4,sm.r-max(sm.g,sm.b));
    sm=mix(sm,vec3(.86,.12,.16),red*.4);
    sm=pow(clamp(sm,0.,1.),vec3(.86))*1.07;sm=mix(sm,vec3(dot(sm,vec3(.333))),-.03);
    sm*=mix(.5,1.,smoothstep(.04,.2,lum));
    sm=mix(sm,vec3(.06,.04,.05),e*.55);
    gl_FragColor=vec4(clamp(sm,0.,1.),1.);
  }`;
  const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
  const pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fsrc));
  gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){gl=null;return}
  gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
  uPx=gl.getUniformLocation(pr,'px');
}

let firstBlend=true,lastGlT=-1;
function renderCartoon(){
  if(video.currentTime!==lastGlT||firstBlend){
    lastGlT=video.currentTime;
    bctx.save();
    if(mirror){bctx.translate(W,0);bctx.scale(-1,1)}
    bctx.globalAlpha=firstBlend?1:.5;
    if(gl){
      gl.viewport(0,0,W,H);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,video);
      gl.uniform2f(uPx,1/W,1/H);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
      bctx.drawImage(glCv,0,0,W,H);
    }else{
      bctx.filter='blur(2px) saturate(1.7) contrast(1.35)';
      bctx.drawImage(video,0,0,W,H);
      bctx.filter='none';
    }
    bctx.restore();
    firstBlend=false;
  }
  cctx.setTransform(SS,0,0,SS,0,0);
  cctx.drawImage(bcv,0,0,W,H);
  drawFace();
}

/* ---------- deteksi & bingkai ---------- */
let tgt=null,cur=null,curInit=false,alpha=0,seen=0,lastT=-1;

function readHands(){
  if(!hl||video.readyState<2||video.currentTime===lastT)return;
  lastT=video.currentTime;
  const r=hl.detectForVideo(video,performance.now());
  const now=performance.now();
  if(r.landmarks&&r.landmarks.length>=2){
    const cv=p=>({x:(mirror?1-p.x:p.x)*W,y:p.y*H});
    const hs=r.landmarks.slice(0,2).map(lm=>({t:cv(lm[4]),i:cv(lm[8]),w:cv(lm[0])}));
    hs.sort((a,b)=>a.w.x-b.w.x);
    const pair=h=>h.t.y<h.i.y?[h.t,h.i]:[h.i,h.t];
    const [lt,lb]=pair(hs[0]),[rt,rb]=pair(hs[1]);
    tgt=[lt,rt,rb,lb];seen=now;
  }else if(now-seen>180)tgt=null;
}

function update(){
  const KF=1-Math.exp(-DT/60),KA=1-Math.exp(-DT/55);
  gm+=((gender==='m'?1:0)-gm)*(1-Math.exp(-DT/250));curS=mixStyle(gm);
  if(!face&&gMode==='auto')gScore*=Math.exp(-DT/3000);
  if(face&&faceT&&face.length===faceT.length)for(let k=0;k<face.length;k++){
    const d=Math.hypot(faceT[k].x-face[k].x,faceT[k].y-face[k].y),kk=1-Math.exp(-DT/Math.max(10,110/(1+d*.15)));
    face[k].x+=(faceT[k].x-face[k].x)*kk;face[k].y+=(faceT[k].y-face[k].y)*kk;
  }
  for(const k in bsT)bs[k]=(bs[k]||0)+(bsT[k]-(bs[k]||0))*KF;
  if(tgt){
    if(!curInit||!cur){cur=tgt.map(p=>({x:p.x,y:p.y}));curInit=true}
    else for(let k=0;k<4;k++){const d=Math.hypot(tgt[k].x-cur[k].x,tgt[k].y-cur[k].y),kk=1-Math.exp(-DT/Math.max(10,70/(1+d*.15)));cur[k].x+=(tgt[k].x-cur[k].x)*kk;cur[k].y+=(tgt[k].y-cur[k].y)*kk}
  }
  alpha+=((tgt?1:0)-alpha)*KA;
  if(!tgt&&alpha<.02)curInit=false;
}

/* ---------- wajah gaya ilustrasi ---------- */
let fl=null,face=null,lastFT=-1,fN=0,faceSeen=0,skin=[235,195,175],skinN=0;
const IDX={
  oval:[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109],
  lipO:[61,146,91,181,84,17,314,405,321,375,291,409,270,269,267,0,37,39,40,185],
  lipI:[78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191],
  browA:[70,63,105,66,107],browB:[336,296,334,293,300],
  eyeA:{up:[33,246,161,160,159,158,157,173,133],lo:[133,155,154,153,145,144,163,7,33]},
  eyeB:{up:[362,398,384,385,386,387,388,466,263],lo:[263,249,390,373,374,380,381,382,362]}
};

let gender='f',gMode='auto',gScore=0;
try{gMode=localStorage.getItem('gaya2')||'auto'}catch(e){}
if(gMode!=='auto')gender=gMode;
const bs={},bsT={};
let faceT=null;
const B=k=>bs[k]||0;
function estGender(f){
  const d=(a,b)=>Math.hypot(f[a].x-f[b].x,f[a].y-f[b].y);
  const fw=d(234,454);if(fw<20)return;
  const jaw=d(172,397)/fw,fh=d(10,152)/fw,brow=d(105,159)/fw,lipH=d(0,17)/d(61,291),eye=d(33,133)/fw;
  // skor positif = cenderung pria (perkiraan kasar dari proporsi wajah)
  const sc=(jaw-.74)*9+(1.38-fh)*3+(.11-brow)*10+(.34-lipH)*3+(.2-eye)*8+Math.max(-.4,Math.min(1.2,(beard-8)/30))*1.2;
  gScore+=(sc-gScore)*.04;
  if(gScore>.35)gender='m';else if(gScore<-.35)gender='f';
}
const STY={
  f:{sx:1.35,sy:1.9,irisK:.27,irisH:.62,lash:.08,es:.3,crease:.55,wing:true,blush:true,lip:'#d9304a',brow:.035,browLift:.02,pe:[255,232,220],pm:.5,fillA:.92,irisC:['#d1914f','#7b4425','#2a150e'],jaw:false},
  m:{sx:1.12,sy:1.45,irisK:.22,irisH:.55,lash:.05,es:0,crease:.3,wing:false,blush:false,lip:'#b86a62',brow:.05,browLift:0,pe:[236,196,168],pm:.3,fillA:.9,irisC:['#8a5a34','#4a2a16','#1a0d08'],jaw:true}
};

let gm=gender==='m'?1:0,beard=0,detMs=0,lastNow=0,DT=16;
function hx(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function mixc(a,b,k){const x=hx(a),y=hx(b);return '#'+x.map((v,i)=>Math.round(v+(y[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function mixStyle(k){
  const a=STY.f,b=STY.m,o={};
  for(const key in a){
    const va=a[key],vb=b[key];
    if(typeof va==='number')o[key]=va+(vb-va)*k;
    else if(typeof va==='boolean')o[key]=k<.5?va:vb;
    else if(typeof va==='string')o[key]=mixc(va,vb,k);
    else if(Array.isArray(va))o[key]=typeof va[0]==='string'?va.map((c,i)=>mixc(c,vb[i],k)):va.map((v,i)=>v+(vb[i]-v)*k);
  }
  return o;
}
let curS=mixStyle(gm);

function readFace(){
  const now=performance.now();
  if(!tgt&&face&&now-faceSeen>250)face=null;
  if(!fl||!tgt||video.readyState<2||video.currentTime===lastFT)return;
  lastFT=video.currentTime;
  if(detMs>(MOB?14:20)&&(fN++&1))return;
  const t0=performance.now();
  const r=fl.detectForVideo(video,now);
  detMs+=((performance.now()-t0)-detMs)*.2;
  if(r.faceLandmarks&&r.faceLandmarks[0]){
    const lm=r.faceLandmarks[0];
    faceT=lm.map(p=>({x:(mirror?1-p.x:p.x)*W,y:p.y*H}));
    if(!face||face.length!==lm.length)face=faceT.map(p=>({x:p.x,y:p.y}));
    faceSeen=now;
    const cats=r.faceBlendshapes&&r.faceBlendshapes[0]&&r.faceBlendshapes[0].categories;
    if(cats)for(const c of cats)bsT[c.categoryName]=c.score;
    if(gMode==='auto')estGender(faceT);
  }else if(now-faceSeen>250)face=null;
}

function crPts(pts,n){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
    for(let t=0;t<n;t++){
      const u=t/n,u2=u*u,u3=u2*u;
      out.push({
        x:.5*(2*p1.x+(-p0.x+p2.x)*u+(2*p0.x-5*p1.x+4*p2.x-p3.x)*u2+(-p0.x+3*p1.x-3*p2.x+p3.x)*u3),
        y:.5*(2*p1.y+(-p0.y+p2.y)*u+(2*p0.y-5*p1.y+4*p2.y-p3.y)*u2+(-p0.y+3*p1.y-3*p2.y+p3.y)*u3)
      });
    }
  }
  out.push(pts[pts.length-1]);
  return out;
}
function curve(pts,closed){
  const c=cctx,m=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  c.beginPath();
  if(closed){
    const n=pts.length,s0=m(pts[n-1],pts[0]);
    c.moveTo(s0.x,s0.y);
    for(let i=0;i<n;i++){const mid=m(pts[i],pts[(i+1)%n]);c.quadraticCurveTo(pts[i].x,pts[i].y,mid.x,mid.y)}
    c.closePath();
  }else{
    c.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length-1;i++){const mid=m(pts[i],pts[i+1]);c.quadraticCurveTo(pts[i].x,pts[i].y,mid.x,mid.y)}
    const l=pts[pts.length-1];c.lineTo(l.x,l.y);
  }
}
function ppath(idx,f,closed){curve(idx.map(i=>f[i]),closed!==false)}
function taper(pts,w0,w1,color){
  const sp=crPts(pts,5),c=cctx;
  c.strokeStyle=color;c.lineCap='round';c.lineJoin='round';
  for(let i=0;i<sp.length-1;i++){
    c.lineWidth=Math.max(.6,w0+(w1-w0)*(i/(sp.length-1)));
    c.beginPath();c.moveTo(sp[i].x,sp[i].y);c.lineTo(sp[i+1].x,sp[i+1].y);c.stroke();
  }
}
function sparkle(x,y,r){
  const c=cctx;
  c.beginPath();c.moveTo(x,y-r);c.quadraticCurveTo(x,y,x+r,y);c.quadraticCurveTo(x,y,x,y+r);c.quadraticCurveTo(x,y,x-r,y);c.quadraticCurveTo(x,y,x,y-r);c.fill();
}

function drawEye(f,e,t){
  const c=cctx,S=curS;
  const up=e.up.map(i=>f[i]),lo=e.lo.map(i=>f[i]),all=up.concat(lo);
  let cx=0,cy=0;all.forEach(p=>{cx+=p.x;cy+=p.y});cx/=all.length;cy/=all.length;
  const SX=S.sx,SY=S.sy*(1-.25*(B('mouthSmileLeft')+B('mouthSmileRight'))/2+.3*(B('eyeWideLeft')+B('eyeWideRight'))/2);
  const T=p=>({x:cx+(p.x-cx)*SX,y:cy+(p.y-cy)*SY});
  const U=up.map(T),Lo=lo.map(T),A=U.concat(Lo.slice(1,-1));
  const xs=A.map(p=>p.x),ys=A.map(p=>p.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  const w=maxX-minX,h=maxY-minY;
  if(w<2)return;
  const i1=f[468],i2=f[473];
  const ir=Math.hypot(i1.x-cx,i1.y-cy)<Math.hypot(i2.x-cx,i2.y-cy)?i1:i2;
  const ic=T(ir);
  const r=Math.max(2,Math.min(h*S.irisH,w*S.irisK));
  const ix=Math.max(minX+r*.6,Math.min(maxX-r*.6,ic.x));
  const lo2=minY+r*.4,hi2=maxY-r*.4;
  const iy=lo2>hi2?cy:Math.max(lo2,Math.min(hi2,ic.y));
  const tw=1+.12*Math.sin(t/260);

  hairB.set(hairS);skinB.set(skinS);cloB.set(cloS);neckB.set(neckS);
  for(const a of [hairB,skinB,cloB,neckB]){blur3(a);blur3(a);blur3(a)}
  // warna rambut, kulit & pakaian diambil otomatis dari kamera

  for(let i=0;i<n;i++){

    const g2=c.createRadialGradient(fx,fy,0,fx,fy,fw*.26);
    g2.addColorStop(0,'rgba(255,255,255,.24)');g2.addColorStop(1,'rgba(255,255,255,0)');
    c.fillStyle=g2;c.fillRect(fx-fw*.3,fy-fw*.3,fw*.6,fw*.6);
  }
  {
    const lg=c.createLinearGradient(f[234].x,f[234].y,f[1].x,f[1].y);
    lg.addColorStop(0,'rgba(150,80,60,'+(.16+.08*gm)+')');lg.addColorStop(.6,'rgba(150,80,60,0)');
    c.fillStyle=lg;c.fillRect(f[234].x-fw,f[234].y-fw*1.5,fw*2.2,fw*3.2);
    const jg=c.createLinearGradient(f[152].x,f[152].y,f[1].x,f[1].y);
    jg.addColorStop(0,'rgba(150,80,60,.18)');jg.addColorStop(.45,'rgba(150,80,60,0)');
    c.fillStyle=jg;c.fillRect(f[1].x-fw,f[1].y-fw,fw*2,fw*2.4);
  }
  c.restore();
  c.restore();
  if(segOn)drawHair(f,fw,OV);
  // pipi merona (berdenyut halus)
  const ba=.3+.05*Math.sin(t/500);
  if(S.blush)[205,425].forEach(i=>{
    const p=f[i],g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,fw*.2);
    g.addColorStop(0,'rgba(255,105,120,'+ba+')');g.addColorStop(1,'rgba(255,105,120,0)');
    c.fillStyle=g;c.fillRect(p.x-fw*.25,p.y-fw*.25,fw*.5,fw*.5);
  });
  // garis rahang
  c.strokeStyle=S.jaw?'rgba(60,35,28,.4)':'rgba(90,50,45,.22)';
  c.lineWidth=Math.max(1.2,fw*(S.jaw?.012:.007));c.lineCap='round';c.lineJoin='round';
  ppath([323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93],f,false);c.stroke();
  // alis meruncing (naik/turun mengikuti ekspresi, dilebihkan)
  const browK=.11*(B('browInnerUp')*.6+(B('browOuterUpLeft')+B('browOuterUpRight'))*.2)-.09*((B('browDownLeft')+B('browDownRight'))/2);
  const bw=Math.max(2,fw*S.brow);
  [IDX.browA.slice().reverse(),IDX.browB].forEach(b=>{
    taper(b.map(i=>({x:f[i].x,y:f[i].y-fw*(S.browLift+browK)})),bw*1.15,bw*.4,'#1c110d');
  });
  // hidung
  c.fillStyle='rgba(120,60,50,.3)';
  [98,327].forEach(i=>{c.beginPath();c.ellipse(f[i].x,f[i].y,fw*.011,fw*.007,0,0,7);c.fill()});
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(f[4].x,f[4].y-fw*.025,fw*.02,fw*.012,0,0,7);c.fill();
  // bibir (dilebihkan saat senyum / mulut terbuka)
  const mx=(f[13].x+f[14].x)/2,my=(f[13].y+f[14].y)/2,smK=(B('mouthSmileLeft')+B('mouthSmileRight'))/2;
  c.save();c.translate(mx,my);c.scale(1+.15*smK,1+.4*B('jawOpen'));c.translate(-mx,-my);
  ppath(IDX.lipO,f);c.fillStyle=S.lip;c.fill();
  const open=Math.hypot(f[13].x-f[14].x,f[13].y-f[14].y);
  if(open>fw*.02){
    ppath(IDX.lipI,f);c.fillStyle='#4a0d16';c.fill();
    c.save();ppath(IDX.lipI,f);c.clip();
    c.fillStyle='#fff';c.fillRect(f[13].x-fw*.3,f[13].y-1,fw*.6,open*.55+1);
    c.restore();
  }
  ppath(IDX.lipO,f);c.strokeStyle='rgba(40,8,14,.8)';c.lineWidth=Math.max(1.2,fw*.01);c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(f[17].x,f[17].y-fw*.018,fw*.05,fw*.009,0,0,7);c.fill();
  c.restore();
  if(smK>.25){
    c.strokeStyle='rgba(60,25,25,'+Math.min(.7,smK)+')';c.lineWidth=Math.max(1,fw*.008);
    [61,291].forEach(i=>{
      const cp=f[i],d=cp.x<f[1].x?-1:1;
      c.beginPath();c.moveTo(cp.x,cp.y);c.quadraticCurveTo(cp.x+d*fw*.03,cp.y-fw*.005,cp.x+d*fw*.035,cp.y-fw*.035);c.stroke();
    });
  }
  // mata besar
  drawEye(f,IDX.eyeA,t);drawEye(f,IDX.eyeB,t);
}

/* ---------- gambar ---------- */
const rnd=Math.random;
let lab='101313',labT=0;

function quadPath(q){ctx.beginPath();ctx.moveTo(q[0].x,q[0].y);for(let k=1;k<4;k++)ctx.lineTo(q[k].x,q[k].y);ctx.closePath()}

function draw(now){
  ctx.setTransform(SS,0,0,SS,0,0);
  ctx.save();
  if(mirror){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.drawImage(video,0,0,W,H);
  ctx.restore();

  if(alpha>.02&&cur){
    renderCartoon();
    const ys=cur.map(p=>p.y),minY=Math.min(...ys),maxY=Math.max(...ys);
    ctx.save();
    ctx.globalAlpha=Math.min(1,alpha);
    quadPath(cur);ctx.clip();
    ctx.drawImage(cart,0,0,W,H);
    // glitch: irisan geser + garis hitam tipis
    const bh=Math.max(4,maxY-minY);
    for(let n=0;n<3;n++){
      if(rnd()<.55){
        const y0=minY+rnd()*bh,h=2+rnd()*7,dx=(rnd()-.5)*46;
        ctx.drawImage(cart,0,y0*SS,W*SS,h*SS,dx,y0,W,h);
      }
    }
    ctx.fillStyle='#000';
    if(rnd()<.5)ctx.fillRect(0,minY+rnd()*bh,W,1+rnd()*1.5);
    ctx.restore();

    // garis hitam tipis saat bingkai menyempit
    const hL=Math.hypot(cur[0].x-cur[3].x,cur[0].y-cur[3].y);
    const hR=Math.hypot(cur[1].x-cur[2].x,cur[1].y-cur[2].y);
    const hh=(hL+hR)/2;
    if(hh<H*.07){
      ctx.save();ctx.globalAlpha=alpha;ctx.strokeStyle='#000';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(cur[0].x,cur[0].y);ctx.lineTo(cur[1].x,cur[1].y);ctx.stroke();
      ctx.restore();
    }
    // label angka kecil di tepi atas
    if(now-labT>90){labT=now;lab=String(Math.floor(rnd()*1e6)).padStart(6,'0')}
    const lx=cur[0].x+(cur[1].x-cur[0].x)*.68,ly=cur[0].y+(cur[1].y-cur[0].y)*.68-5;
    ctx.save();ctx.globalAlpha=alpha*.85;ctx.fillStyle='#fff';ctx.font='9px ui-monospace,monospace';ctx.fillText(lab,lx,ly);ctx.restore();
  }

  if(showDbg&&cur){
    ctx.save();ctx.strokeStyle='#4cf';ctx.fillStyle='#4cf';ctx.lineWidth=1.5;
    quadPath(cur);ctx.stroke();
    cur.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()});
    ctx.restore();
  }
  $('hint').style.opacity=(tgt||alpha>.1)?0:1;
}

let fc=0,ft=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  DT=Math.min(64,Math.max(1,now-(lastNow||now-16)));lastNow=now;
  fEma+=(DT-fEma)*.04;if(!lite&&fEma>42)lite=true;else if(lite&&fEma<24)lite=false;
  readHands();readFace();readSeg();update();draw(now);
  fc++;if(now-ft>1000){$('fps').textContent=fc+' FPS';fc=0;ft=now}
}

/* ---------- UI ---------- */
$('go').onclick=async()=>{
  const b=$('go');b.disabled=true;$("errMsg").textContent='';b.textContent='Membuka kamera…';
  try{
    await openCam();
    initGL();
    $('ov').style.display='none';$('bar').style.display='flex';
    if(!started){started=true;requestAnimationFrame(loop)}
  }catch(e){
    $("errMsg").textContent='Gagal: '+(e.message||e);
    b.disabled=false;b.textContent='Coba lagi';
    return;
  }
  if(!hl){
    $('hint').textContent='Memuat model tangan…';
    try{await loadModel();$('hint').textContent='Bentuk huruf L (jempol + telunjuk) dengan kedua tangan'}
    catch(e){$('hint').textContent='Model tangan gagal dimuat: '+(e.message||e)+' (cek internet)'}
  }
};
let started=false;
$('flip').onclick=async()=>{
  facing=facing==='user'?'environment':'user';
  try{await openCam()}catch(e){facing=facing==='user'?'environment':'user';await openCam()}
};
const nm=g=>g==='f'?'Perempuan':'Laki-laki';
const gl2=()=>$('btnGender').textContent='Gaya: '+(gMode==='auto'?'Otomatis ('+nm(gender)+')':nm(gMode));
gl2();setInterval(gl2,700);
$('btnGender').onclick=()=>{gMode=gMode==='auto'?'f':gMode==='f'?'m':'auto';if(gMode!=='auto')gender=gMode;try{localStorage.setItem('gaya2',gMode)}catch(e){}gl2()};
$("btnHair").onclick=()=>{useHair=!useHair;$("btnHair").textContent='Rambut & baju: '+(useHair?'nyala':'mati')};
$("btnDots").onclick=()=>{showDbg=!showDbg;$("btnDots").textContent='Titik tangan: '+(showDbg?'nyala':'mati')};
</script>
